trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - automation/**

pr:
  branches:
    include:
      - main
      - develop

schedules:
  - cron: '0 2 * * *'
    displayName: Nightly Selenium Run
    branches:
      include:
        - main
    always: true

variables:
  nodeVersion: '20.x'
  workingDir: '$(System.DefaultWorkingDirectory)/automation'

parameters:
  - name: browser
    type: string
    default: chrome
    values: [chrome, firefox, edge]
  - name: headless
    type: boolean
    default: true

stages:
  - stage: SeleniumTests
    displayName: Selenium E2E Tests
    jobs:
      - job: RunTests
        displayName: 'Run Selenium Tests (${{ parameters.browser }})'
        timeoutInMinutes: 60
        pool:
          vmImage: 'ubuntu-latest'

        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
            displayName: Install Node.js

          - script: npm ci
            workingDirectory: $(workingDir)
            displayName: Install dependencies

          - script: npm run test:parallel:ci
            workingDirectory: $(workingDir)
            displayName: Run Selenium tests
            env:
              BASE_URL: $(BASE_URL)
              API_URL: $(API_URL)
              BROWSER: ${{ parameters.browser }}
              HEADLESS: ${{ parameters.headless }}
              GSA_EMAIL: $(GSA_EMAIL)
              GSA_PASSWORD: $(GSA_PASSWORD)
              ADMIN_EMAIL: $(ADMIN_EMAIL)
              ADMIN_PASSWORD: $(ADMIN_PASSWORD)
              USER_EMAIL: $(USER_EMAIL)
              USER_PASSWORD: $(USER_PASSWORD)
              INACTIVE_EMAIL: $(INACTIVE_EMAIL)
              INACTIVE_PASSWORD: $(INACTIVE_PASSWORD)
            continueOnError: true

          - script: npm run report:generate || true
            workingDirectory: $(workingDir)
            displayName: Generate Allure report
            condition: always()

          - task: PublishTestResults@2
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '$(workingDir)/reports/junit*.xml'
              mergeTestResults: true
              testRunTitle: 'Selenium E2E - ${{ parameters.browser }}'
            condition: always()
            displayName: Publish test results

          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: '$(workingDir)/reports'
              artifactName: 'allure-report-${{ parameters.browser }}'
            condition: always()
            displayName: Upload Allure report

          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: '$(workingDir)/screenshots'
              artifactName: 'screenshots-${{ parameters.browser }}'
            condition: failed()
            displayName: Upload screenshots on failure
